management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, caches
  info:
    env:
      # Disabled in production: even sanitized env exposure widens the info surface.
      enabled: false

info:
  project:
    name: RebaseRescue
    description: "Self-hosted AI-powered code audit and PR analysis service with multi-provider support"
    version: "@project.version@"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html


# PR Copilot Configuration

prcopilot:
  analysis:
    # The maximum allowed diff size in characters; above this you can reject or truncate
    max-diff-chars: ${PRCOPILOT_ANALYSIS_MAX_DIFF_CHARS:50000}
    # Hard byte ceiling on /api/v1/** JSON request bodies, enforced before
    # deserialization (DoS guard; must comfortably exceed max-diff-chars + JSON overhead)
    max-request-bytes: ${PRCOPILOT_ANALYSIS_MAX_REQUEST_BYTES:262144}
    default-language: ${PRCOPILOT_ANALYSIS_DEFAULT_LANGUAGE:en}
    # The default "style" for titles/descriptions
    default-style: ${PRCOPILOT_ANALYSIS_DEFAULT_STYLE:conventional-commits}
    # Include raw model output in the response (useful for debugging; keep false in prod)
    include-raw-model-output: ${PRCOPILOT_ANALYSIS_INCLUDE_RAW_MODEL_OUTPUT:false}
    # Hard ceiling on model output chars parsed (DoS guard; model maxTokens bounds this anyway)
    max-model-output-chars: ${PRCOPILOT_ANALYSIS_MAX_MODEL_OUTPUT_CHARS:1000000}
    # Hard ceilings on model-provided list sizes (DoS guard against list-bomb payloads)
    max-risks: ${PRCOPILOT_ANALYSIS_MAX_RISKS:200}
    max-suggested-tests: ${PRCOPILOT_ANALYSIS_MAX_SUGGESTED_TESTS:100}
    max-touched-files: ${PRCOPILOT_ANALYSIS_MAX_TOUCHED_FILES:500}
    # Diff-hash response cache (0 = disabled)
    cache-max-size: ${PRCOPILOT_CACHE_DIFF_MAX_SIZE:1000}
    # Per-entry cache admission budget in characters: oversized responses are
    # served but not stored, bounding worst-case heap (entries times budget)
    cache-max-entry-chars: ${PRCOPILOT_CACHE_DIFF_MAX_ENTRY_CHARS:100000}
    cache-ttl: ${PRCOPILOT_CACHE_DIFF_TTL:30m}
    # Minimum severity to include in responses/SARIF (note|warning|error)
    min-level: ${PRCOPILOT_GATE_MIN_LEVEL:note}

  logging:
    # Whether to log prompts and/or responses (never raw diffs; metadata only)
    log-prompts: ${PRCOPILOT_LOG_PROMPTS:false}
    log-responses: ${PRCOPILOT_LOG_RESPONSES:false}

  ai:
    # Primary AI provider: openai, anthropic, gemini, ollama
    provider: ${PRCOPILOT_AI_PROVIDER:openai}
    # Optional fallback provider (empty = none)
    fallback-provider: ${PRCOPILOT_AI_FALLBACK_PROVIDER:}
    # Enable automatic fallback
    auto-fallback: ${PRCOPILOT_AI_AUTO_FALLBACK:false}
    temperature: ${AI_TEMPERATURE:0.1}
    max-tokens: ${AI_MAX_TOKENS:1024}
    timeout-millis: ${AI_TIMEOUT_MILLIS:30000}
    # Opt-in startup reachability ping of provider base URLs (warn-only, never fails startup)
    health-check-ping: ${PRCOPILOT_AI_HEALTH_CHECK_PING:false}
    # Concurrency bulkheads are configured exclusively via the resilience4j.bulkhead
    # block below (startup-validated); no duplicates here.
    # API rate limiting is configured exclusively via the resilience4j.ratelimiter
    # block below (Duration-typed, startup-validated); no duplicates here.

  prompts:
    system-prompt: classpath:prompts/system-prompt.txt

  auth:
    # prod profile: OIDC issuer required (fail-closed, no default).
    # selfhost profile: single-user API key instead of OIDC.
    mode: ${PRCOPILOT_AUTH_MODE:selfhost}
    api-key: ${PRCOPILOT_API_KEY:}
    api-key-header: Authorization

  sarif:
    # SARIF consumer this output targets: github (Code Scanning) or sonar
    consumer: ${PRCOPILOT_SARIF_CONSUMER:github}
    category: ${PRCOPILOT_SARIF_CATEGORY:rebase-rescue}
    # Path to repo-local false-positive suppress file (empty = no suppression)
    suppress-file: ${PRCOPILOT_SUPPRESS_FILE:.ai-review-ignore.yml}
    # Maximum serialized SARIF bytes accepted for upload (GitHub caps at 10MB gzipped)
    max-bytes: ${PRCOPILOT_SARIF_MAX_BYTES:5000000}

github:
  enabled: ${GITHUB_ENABLED:false}
  app:
    app-id: ${GITHUB_APP_ID:}
    client-id: ${GITHUB_APP_CLIENT_ID:}
    private-key: ${GITHUB_APP_PRIVATE_KEY:}
    installation-id: ${GITHUB_APP_INSTALLATION_ID:}
  webhook:
    secret: ${GITHUB_WEBHOOK_SECRET:}
    dedup-ttl: ${GITHUB_WEBHOOK_DEDUP_TTL:30d}
    dedup-max-size: ${GITHUB_WEBHOOK_DEDUP_MAX_SIZE:100000}
    # Hard byte ceiling on webhook JSON bodies, enforced before HMAC work (min 1024).
    # Deliveries are metadata only; diff is fetched separately, so 1MB is generous.
    max-request-bytes: ${GITHUB_WEBHOOK_MAX_REQUEST_BYTES:1048576}
  api:
    base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
    # Explicit SSRF allowlist for the API host (comma-separated or YAML list,
    # whole-list replace). Add an Enterprise Server FQDN to opt in.
    allowed-hosts: ${GITHUB_API_ALLOWED_HOSTS:api.github.com}
    api-version: ${GITHUB_API_VERSION:2026-03-10}
    token-cache-ttl: ${GITHUB_TOKEN_CACHE_TTL:55m}
    token-cache-max-size: ${GITHUB_TOKEN_CACHE_MAX_SIZE:100}
  sarif:
    category: ${GITHUB_SARIF_CATEGORY:rebase-rescue}

spring:
  threads:
    virtual:
      enabled: ${SPRING_THREADS_VIRTUAL_ENABLED:true}
  http:
    clients:
      connect-timeout: ${SPRING_HTTP_CLIENTS_CONNECT_TIMEOUT:5s}
      read-timeout: ${SPRING_HTTP_CLIENTS_READ_TIMEOUT:40s}
  ai:
    openai:
      # No default: AppStartupCheck fails fast with a clear message when unset.
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        model: ${OPENAI_MODEL:gpt-4o-mini}

    anthropic:
      # No default: AppStartupCheck fails fast with a clear message when unset.
      api-key: ${ANTHROPIC_API_KEY:}
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
      chat:
        model: ${ANTHROPIC_MODEL:claude-sonnet-4-0}

    google:
      genai:
        api-key: ${GOOGLE_GENAI_API_KEY:}
        project-id: ${GOOGLE_GENAI_PROJECT_ID:${GEMINI_PROJECT_ID:}}
        location: ${GOOGLE_GENAI_LOCATION:${GEMINI_LOCATION:us-central1}}
        chat:
          model: ${GOOGLE_GENAI_MODEL:${GEMINI_MODEL:gemini-2.5-flash}}

    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_MODEL:qwen3:4b}

  application:
    name: rebase-rescue
    version: "@project.version@"

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:}

server:
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_THREADS_MAX:30}
      min-spare: ${SERVER_TOMCAT_THREADS_MIN_SPARE:10}
    max-http-form-post-size: 512KB
    max-swallow-size: 512KB

resilience4j:
  bulkhead:
    instances:
      ai-saas:
        maxConcurrentCalls: ${PRCOPILOT_AI_BULKHEAD_SAAS_MAX_CONCURRENT:15}
        maxWaitDuration: ${PRCOPILOT_AI_BULKHEAD_MAX_WAIT_MILLIS:0}ms
      ai-ollama:
        maxConcurrentCalls: ${PRCOPILOT_AI_BULKHEAD_OLLAMA_MAX_CONCURRENT:3}
        maxWaitDuration: ${PRCOPILOT_AI_BULKHEAD_MAX_WAIT_MILLIS:0}ms
  ratelimiter:
    instances:
      api:
        limitForPeriod: ${PRCOPILOT_RATELIMITER_LIMIT_FOR_PERIOD:30}
        limitRefreshPeriod: ${PRCOPILOT_RATELIMITER_REFRESH_PERIOD:1m}
        timeoutDuration: ${PRCOPILOT_RATELIMITER_TIMEOUT_MILLIS:0}ms
      github-webhook:
        limitForPeriod: ${GITHUB_WEBHOOK_RATELIMITER_LIMIT_FOR_PERIOD:60}
        limitRefreshPeriod: ${GITHUB_WEBHOOK_RATELIMITER_REFRESH_PERIOD:1m}
        timeoutDuration: ${GITHUB_WEBHOOK_RATELIMITER_TIMEOUT_MILLIS:0}ms

logging:
  level:
    root: ${LOG_LEVEL_ROOT:info}
    io.github.kxng0109.rebaserescue: ${LOG_LEVEL_KXNG:info}
