name: CI

on:
  push:
    branches:
      - main
      - '**'
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and run tests
        run: bash ./mvnw -B verify

      - name: Upload built artifacts for scanning
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-target
          path: target
          if-no-files-found: error
          retention-days: 1

  trivy:
    needs: build-and-test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record date for Trivy cache key
        id: date
        run: echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore Trivy DB cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ${{ github.workspace }}/.cache/trivy
          key: cache-trivy-${{ steps.date.outputs.date }}
          restore-keys: |
            cache-trivy-

      - name: Configure Trivy skip flags
        # TRIVY_SKIP_JAVA_DB_UPDATE is fatal when the cache does not exist
        # ("cannot be specified on the first run"), so only enable skipping
        # once the warm job has actually populated the DBs.
        run: |
          if [ -d "${GITHUB_WORKSPACE}/.cache/trivy/db" ] && [ -d "${GITHUB_WORKSPACE}/.cache/trivy/java-db" ]; then
            echo "TRIVY_SKIP_DB_UPDATE=true" >> "$GITHUB_ENV"
            echo "TRIVY_SKIP_JAVA_DB_UPDATE=true" >> "$GITHUB_ENV"
            echo "Trivy DBs cached; skipping download"
          else
            echo "Trivy cache not present; allowing DB download"
          fi

      - name: Download built artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-target
          path: target

      - name: Trivy artifact gate (HIGH/CRITICAL block)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: target
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'

  security-eval:
    # Run on pull requests only, not on pushes to main, so the common
    # path stays fast. The JUnit test itself is the gate: it asserts
    # regression-vs-pinned-baseline, so a documented gap stays green while
    # a real regression fails the job.
    if: github.event_name == 'pull_request'
    needs: build-and-test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run adversarial security eval
        run: bash ./mvnw -B test -Dtest=GuardrailEvalTest

      - name: Publish eval summary
        if: always()
        run: |
          if [ -f target/security-eval.json ]; then
            echo "## Security eval results" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat target/security-eval.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Security eval: no report produced" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-eval-report
          path: target/security-eval.json
          if-no-files-found: warn
          retention-days: 1