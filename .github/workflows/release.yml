name: Release

# Tag-driven enterprise release: v*.*.* (stable) or v*.*.*-rc.* (prerelease).
# Pipeline: validate tag<->pom -> test -> Trivy fs gate -> build+smoke ->
# image push -> sign+attest -> publish Release immediately.
on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: { }

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      make-latest: ${{ steps.version.outputs.make-latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Validate tag matches pom and derive flags
        id: version
        run: |
          TAGV="${GITHUB_REF_NAME#v}"
          if ! echo "$TAGV" | grep -Eq -- '^[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta|alpha|preview)[.0-9-]*)?$'; then
            echo "Tag $GITHUB_REF_NAME is not valid SemVer"; exit 1
          fi
          POMV=$(bash ./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          if [ "$TAGV" != "$POMV" ]; then
            echo "tag $TAGV != pom $POMV"; exit 1
          fi
          case "$TAGV" in
            *-rc*|*-beta*|*-alpha*|*-preview*)
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
              echo "make-latest=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
              echo "make-latest=true" >> "$GITHUB_OUTPUT"
              ;;
          esac
          echo "version=$TAGV" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $TAGV"

  test:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and run tests
        run: bash ./mvnw -B verify

  trivy-fs:
    needs: [ validate, build ]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: target-${{ needs.validate.outputs.version }}
          path: target

      - name: Record date for Trivy cache key
        id: date
        run: echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore Trivy DB cache
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v4
        with:
          path: ${{ github.workspace }}/.cache/trivy
          key: cache-trivy-${{ steps.date.outputs.date }}
          restore-keys: |
            cache-trivy-

      - name: Configure Trivy skip flags
        # TRIVY_SKIP_JAVA_DB_UPDATE is fatal when the cache does not exist
        # ("cannot be specified on the first run"), so only enable skipping
        # once the warm job has actually populated the DBs.
        run: |
          if [ -d "${GITHUB_WORKSPACE}/.cache/trivy/db" ] && [ -d "${GITHUB_WORKSPACE}/.cache/trivy/java-db" ]; then
            echo "TRIVY_SKIP_DB_UPDATE=true" >> "$GITHUB_ENV"
            echo "TRIVY_SKIP_JAVA_DB_UPDATE=true" >> "$GITHUB_ENV"
            echo "Trivy DBs cached; skipping download"
          else
            echo "Trivy cache not present; allowing DB download"
          fi

      - name: Trivy artifact gate (HIGH/CRITICAL block)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: target
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
          exit-code: '1'

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: trivy-fs.sarif

  build:
    needs: [ validate, test ]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Package (tests already green in test job)
        run: bash ./mvnw -B -DskipTests package

      - name: Generate CycloneDX aggregate SBOM
        # The plugin is bound to the package phase, but that lifecycle
        # invocation only writes the embedded
        # META-INF/sbom/application.cdx.json. The aggregate BOMs
        # (target/bom.json, target/bom.xml) are produced only by the
        # explicit goal, so invoke it directly.
        run: bash ./mvnw org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom -q

      - name: Rename artifacts deterministically
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          TARGET="target/rebase-rescue-${VERSION}.jar"
          # Spring Boot leaves a '<artifact>-<version>.jar.original' alongside
          # the repackaged fat JAR, so the bare glob must exclude it.
          shopt -s nullglob
          for f in target/rebase-rescue-*.jar; do
            case "$f" in
              *.original) continue ;;
              *) [ "$f" != "$TARGET" ] && mv "$f" "$TARGET"; break ;;
            esac
          done
          [ -f "$TARGET" ] || { echo "ERROR: no fat JAR found in target/"; exit 1; }
          # CycloneDX aggregate BOMs are the primary, verified SBOM assets.
          # Spring Boot's META-INF/sbom is optional: its presence for
          # Boot 4.1 could not be verified from the docs, so never let a
          # missing file fail the build.
          cp target/bom.json "target/rebase-rescue-${VERSION}-cyclonedx-aggregate.json" 2>/dev/null || echo "WARN: target/bom.json not found"
          cp target/bom.xml "target/rebase-rescue-${VERSION}-cyclonedx-aggregate.xml" 2>/dev/null || echo "WARN: target/bom.xml not found"
          if [ -f target/classes/META-INF/sbom/application.cdx.json ]; then
            cp target/classes/META-INF/sbom/application.cdx.json "target/rebase-rescue-${VERSION}-cyclonedx.json"
          else
            echo "WARN: Spring Boot META-INF/sbom not present; skipping embedded BOM asset"
          fi
          cd target
          sha256sum "rebase-rescue-${VERSION}.jar" > "rebase-rescue-${VERSION}.jar.sha256"
          sha256sum -c "rebase-rescue-${VERSION}.jar.sha256"

      - name: Smoke test (actuator health with dummy key)
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          # Spring AI's chat auto-config is gated on spring.ai.model.chat,
          # which application.yml leaves empty so the runtime provider can
          # override it. Without this the OpenAI bean is never created and
          # the context fails to start, so set it explicitly for the smoke run.
          OPENAI_API_KEY=dummy-smoke-key PRCOPILOT_API_KEY=dummy-smoke-key \
          SPRING_AI_MODEL_CHAT=openai GOOGLE_GENAI_PROJECT_ID=dummy-smoke-project GOOGLE_GENAI_LOCATION=us-central1 \
            java -jar "target/rebase-rescue-${VERSION}.jar" > smoke.log 2>&1 &
          PID=$!
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Smoke OK"; kill $PID; exit 0
            fi
            sleep 5
          done
          echo "Smoke FAILED"; cat smoke.log; kill $PID; exit 1

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ needs.validate.outputs.version }}
          path: |
            target/rebase-rescue-${{ needs.validate.outputs.version }}.jar
            target/rebase-rescue-${{ needs.validate.outputs.version }}.jar.sha256
            target/rebase-rescue-${{ needs.validate.outputs.version }}-cyclonedx-aggregate.json
            target/rebase-rescue-${{ needs.validate.outputs.version }}-cyclonedx-aggregate.xml
          if-no-files-found: error
          retention-days: 7

      - name: Upload full build tree for vulnerability scanning
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: target-${{ needs.validate.outputs.version }}
          path: target
          if-no-files-found: error
          retention-days: 1

  docker:
    needs: [ validate, build ]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record date for Trivy cache key
        id: date
        run: echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore Trivy DB cache
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v4
        with:
          path: ${{ github.workspace }}/.cache/trivy
          key: cache-trivy-${{ steps.date.outputs.date }}
          restore-keys: |
            cache-trivy-

      - name: Configure Trivy skip flags
        # TRIVY_SKIP_JAVA_DB_UPDATE is fatal when the cache does not exist
        # ("cannot be specified on the first run"), so only enable skipping
        # once the warm job has actually populated the DBs.
        run: |
          if [ -d "${GITHUB_WORKSPACE}/.cache/trivy/db" ] && [ -d "${GITHUB_WORKSPACE}/.cache/trivy/java-db" ]; then
            echo "TRIVY_SKIP_DB_UPDATE=true" >> "$GITHUB_ENV"
            echo "TRIVY_SKIP_JAVA_DB_UPDATE=true" >> "$GITHUB_ENV"
            echo "Trivy DBs cached; skipping download"
          else
            echo "Trivy cache not present; allowing DB download"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (stable-only latest)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/rebase-rescue
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ needs.validate.outputs.version }}
            AOTCACHE_ENABLED=1
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/rebase-rescue:latest
          cache-to: type=inline

      - name: Trivy image gate (HIGH/CRITICAL block)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: ghcr.io/${{ github.repository_owner }}/rebase-rescue@${{ steps.push.outputs.digest }}
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: table
          exit-code: '1'

  sign-attest:
    needs: [ validate, build, docker ]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ needs.validate.outputs.version }}
          path: target

      - name: Log in to GHCR
        # cosign sign uploads the signature as a blob to the registry, so
        # the registry must be authenticated in this job too.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign JAR blob (keyless bundle)
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          cosign sign-blob --yes \
            --bundle "target/rebase-rescue-${VERSION}.jar.sigstore.json" \
            "target/rebase-rescue-${VERSION}.jar"

      - name: Sign image by digest
        run: |
          cosign sign --yes \
            "ghcr.io/${{ github.repository_owner }}/rebase-rescue@${{ needs.docker.outputs.digest }}"

      - name: Image SBOM (Syft via sbom-action)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ghcr.io/${{ github.repository_owner }}/rebase-rescue@${{ needs.docker.outputs.digest }}
          format: cyclonedx-json
          output-file: target/rebase-rescue-${{ needs.validate.outputs.version }}-image.sbom.cyclonedx.json

      - name: Attest JAR provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: attest-jar
        with:
          subject-path: target/rebase-rescue-${{ needs.validate.outputs.version }}.jar
          push-to-registry: false

      - name: Stage attestation bundle
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          cp "${{ steps.attest-jar.outputs.bundle-path }}" "target/rebase-rescue-${VERSION}.attestation.sigstore.json"

      - name: Attest image provenance + SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/rebase-rescue
          subject-digest: ${{ needs.docker.outputs.digest }}
          push-to-registry: true

      - name: Upload signed artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-${{ needs.validate.outputs.version }}
          path: |
            target/rebase-rescue-${{ needs.validate.outputs.version }}.jar.sigstore.json
            target/rebase-rescue-${{ needs.validate.outputs.version }}-image.sbom.cyclonedx.json
            target/rebase-rescue-${{ needs.validate.outputs.version }}.attestation.sigstore.json
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [ validate, build, docker, sign-attest ]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ needs.validate.outputs.version }}
          path: target

      - name: Download signed artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-${{ needs.validate.outputs.version }}
          path: target

      - name: Determine changelog range
        id: cliff-range
        run: |
          TAG="${{ github.ref_name }}"
          # --current renders nothing when HEAD is exactly the tag (no commits
          # after it), which published empty notes. Use the explicit tag range
          # instead: deterministic regardless of checkout position.
          if PREV_TAG="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null)"; then
            echo "args=--tag ${TAG} ${PREV_TAG}..${TAG} --strip header -o CHANGELOG-current.md" >> "$GITHUB_OUTPUT"
            echo "previous=${PREV_TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "args=--tag ${TAG} --strip header -o CHANGELOG-current.md" >> "$GITHUB_OUTPUT"
            echo "previous=" >> "$GITHUB_OUTPUT"
          fi
          echo "Changelog range: ${PREV_TAG:-<beginning>}..${TAG}"

      - name: Generate conventional changelog
        id: cliff
        uses: orhun/git-cliff-action@3d96a18cc4ec17e9dc69ddcc424ccafaf1f78ce2 # v4
        with:
          config: cliff.toml
          args: ${{ steps.cliff-range.outputs.args }}

      - name: Assemble release notes
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          {
            echo "## RebaseRescue ${VERSION}"
            echo ""
            echo "### Verify"
            echo ""
            echo '```bash'
            echo "sha256sum -c rebase-rescue-${VERSION}.jar.sha256"
            echo "cosign verify-blob --bundle rebase-rescue-${VERSION}.jar.sigstore.json \\"
            echo "  --certificate-identity-regexp 'https://github.com/${{ github.repository }}' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  rebase-rescue-${VERSION}.jar"
            echo '```'
            echo ""
            echo "Container: \`ghcr.io/${{ github.repository_owner }}/rebase-rescue:${VERSION}\`"
            echo ""
            echo "### Changes"
            echo ""
            # -s guards the previous silent failure: cat of an empty file
            # succeeds and hid the empty notes. Compare link is the last resort.
            if [ -s CHANGELOG-current.md ]; then
              cat CHANGELOG-current.md
            elif [ -n "${{ steps.cliff.outputs.content }}" ]; then
              echo "${{ steps.cliff.outputs.content }}"
            elif [ -n "${{ steps.cliff-range.outputs.previous }}" ]; then
              echo "See the full commit list: https://github.com/${{ github.repository }}/compare/${{ steps.cliff-range.outputs.previous }}...${{ github.ref_name }}"
            else
              echo "See the full commit list: https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}"
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Publish GitHub Release immediately
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ needs.validate.outputs.prerelease }}
          make_latest: ${{ needs.validate.outputs.make-latest }}
          body_path: release-notes.md
          fail_on_unmatched_files: false
          files: |
            target/rebase-rescue-${{ needs.validate.outputs.version }}.jar
            target/rebase-rescue-${{ needs.validate.outputs.version }}.jar.sha256
            target/rebase-rescue-${{ needs.validate.outputs.version }}-cyclonedx-aggregate.json
            target/rebase-rescue-${{ needs.validate.outputs.version }}-cyclonedx-aggregate.xml
            target/rebase-rescue-${{ needs.validate.outputs.version }}-image.sbom.cyclonedx.json
            target/rebase-rescue-${{ needs.validate.outputs.version }}.jar.sigstore.json
            target/rebase-rescue-${{ needs.validate.outputs.version }}.attestation.sigstore.json

      - name: Release summary
        run: |
          echo "Release v${{ needs.validate.outputs.version }} published (prerelease=${{ needs.validate.outputs.prerelease }})"
          echo "Image: ghcr.io/${{ github.repository_owner }}/rebase-rescue@${{ needs.docker.outputs.digest }}"
