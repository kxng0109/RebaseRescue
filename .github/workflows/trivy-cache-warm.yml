name: Trivy cache warm

# Pre-warms the Trivy vulnerability DB and Java DB on the default
# branch so scan jobs can run with TRIVY_SKIP_DB_UPDATE=true and
# TRIVY_SKIP_JAVA_DB_UPDATE=true and never re-download the ~112 MB
# databases (avoids transient network failures and keeps scans fast).
#
# Pattern from the official aquasecurity/trivy-action README.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'

permissions: {}

jobs:
  warm:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record date for cache key
        id: date
        run: echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Install oras
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        # NOTE: do NOT pass a 'version' input here. setup-oras rejects
        # both 'v1.3.x' and '1.3.4' ("official ORAS CLI releases does not
        # contain version ..."), so use the action's default version, which
        # is the documented working path and is current.

      - name: Download and extract the vulnerability DB
        run: |
          mkdir -p $GITHUB_WORKSPACE/.cache/trivy/db
          oras pull ghcr.io/aquasecurity/trivy-db:2
          tar -xzf db.tar.gz -C $GITHUB_WORKSPACE/.cache/trivy/db
          rm db.tar.gz

      - name: Download and extract the Java DB
        run: |
          mkdir -p $GITHUB_WORKSPACE/.cache/trivy/java-db
          oras pull ghcr.io/aquasecurity/trivy-java-db:1
          tar -xzf javadb.tar.gz -C $GITHUB_WORKSPACE/.cache/trivy/java-db
          rm javadb.tar.gz

      - name: Save DBs to cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ${{ github.workspace }}/.cache/trivy
          # Include the run id so concurrent runs (e.g. the warm job and a
          # release triggered by the same push) never contend for one key.
          key: cache-trivy-${{ steps.date.outputs.date }}-${{ github.run_id }}